name: CI

# TETİK: master'a push VEYA herhangi bir PR açıl/güncellenince koş.
# feature push'u yalnız pull_request'i tetikler (push master'a kısıtlı) — çift koşu yok.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ───────────── KAPI: her PR + her master push'ta derle + test ─────────────
  # restore GitHub Packages'tan Platform.Auth çeker → GH_PACKAGES_TOKEN şart (NuGet.config'teki
  # %GH_PACKAGES_TOKEN%'ı doldurur). GITHUB_TOKEN repo-scoped; Platform.Auth paketine ERİŞİM VERİLMELİ
  # (paket ayarları → Actions access → bu repo) VEYA paket public/internal. Yoksa restore 401.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read              # GitHub Packages'tan Platform.Auth okumak için
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  # ───────────── ÜRETİM: yalnız master merge'inde image bas + ghcr'a it ─────────────
  # needs: build-test (kapı) · if: yalnız master push · aspire do push → 15 servis image → ghcr.
  image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # ghcr'a image yaz + Platform.Auth oku
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # aspire build restore'u da Platform.Auth çeker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aspire CLI kur
        run: |
          dotnet tool install -g Aspire.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ghcr login: GITHUB_TOKEN kişisel (user) namespace'inde yeni paket OLUŞTURAMAZ
      # (denied: permission_denied: write_package) → write:packages'li PAT (GHCR_PAT secret) şart.
      - name: ghcr login
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Dockerfile'sız SDK container build + ghcr'a it → ghcr.io/hasancagri/ecommerce/<servis> (15 image).
      # aspire tag'i = aspire-deploy-<zaman damgası> (değişken); CD kararlı tag ister.
      - name: Image bas + ghcr'a it
        run: aspire do push --apphost src/aspire/AppHost/AppHost.csproj --non-interactive

      # CD kararlı tag: runner'ın local docker'ındaki aspire-tag'li image'ları :latest'e retag + push.
      # CD (deploy job) :latest + imagePullPolicy Always + rollout restart ile yeni kodu çeker.
      - name: ':latest' tag + push
        run: |
          for svc in catalog-api stock-api basket-api order-api payment-api customer-api \
                     checkout-orchestrator reviews-api library-api discount-api mail-mcp \
                     notification-agent file-api gateway storefront-api; do
            repo="ghcr.io/hasancagri/ecommerce/$svc"
            src=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^${repo}:aspire-deploy-" | head -1)
            if [ -n "$src" ]; then docker tag "$src" "$repo:latest" && docker push "$repo:latest"; fi
          done

  # ───────────── CD: yalnız master merge'inde cluster'a deploy (SSH → kubectl) ─────────────
  # needs: image · k3s API 6443 internete KAPALI → runner port 22'den SSH eder, kubectl'i SUNUCUDA koşar.
  # DEPLOY_SSH_KEY secret'ı = dehost_vds private key (runner bağlanır). ghcr-pull + openai secret'ları
  # cluster'da BİR KEZ elle kurulur (CD'de değil, bkz. deploy/k8s/README.md).
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H 91.132.49.70 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Manifest kopyala + uygula + app rollout
        run: |
          scp -i ~/.ssh/deploy -r deploy/k8s root@91.132.49.70:/tmp/deploy-k8s
          ssh -i ~/.ssh/deploy root@91.132.49.70 '
            kubectl apply -f /tmp/deploy-k8s/
            # app deployment'larını yeniden başlat (yeni :latest çekilsin); altyapı (pg/rabbit/es) HARİÇ
            apps=$(kubectl -n ecommerce get deploy -o name | grep -vE "postgres|rabbitmq|elasticsearch")
            kubectl -n ecommerce rollout restart $apps
            kubectl -n ecommerce rollout status $apps --timeout=300s
          '