# Altyapı — namespace + Postgres(ParadeDB) + RabbitMQ + Redis. PVC KALICI (ephemeral değil):
# katalog (22k) + kullanıcı/sohbet verisi restart'ta durur. ES SÖKÜLDÜ (arama Catalog pg-hibrit'e katlandı).
# Postgres = ParadeDB (pg_search BM25 + pgvector); catalogDb'de extension init'te açılır. Init idempotent.
# DEV NOTU: PG parolası düz (cluster-only, ufw-kapalı 5432); prod'da Secret + managed + büyük PVC.
---
apiVersion: v1
kind: Namespace
metadata: { name: ecommerce }
---
# Init (idempotent .sh): 12 BC DB'sini guard'lı oluştur + catalogDb'ye pg_search/vector extension.
# initdb.d yalnız BOŞ veri dizininde koşar; guard ikinci-güvenlik (PVC + elle apply senaryosu).
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: ecommerce }
data:
  init.sh: |
    #!/bin/bash
    set -e
    for db in catalogDb basketDb orderDb paymentDb customerDb fileDb identityDb \
              reviewsDb libraryDb stockDb discountDb personalizationDb scoutDb; do
      if ! psql -U "$POSTGRES_USER" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
        psql -U "$POSTGRES_USER" -c "CREATE DATABASE \"$db\""
      fi
    done
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d catalogDb -c "CREATE EXTENSION IF NOT EXISTS pg_search;"
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d catalogDb -c "CREATE EXTENSION IF NOT EXISTS vector;"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: ecommerce }
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: local-path
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: ecommerce }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC — eski+yeni pod aynı anda mount edemez
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: paradedb/paradedb:0.26.6-pg17
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: CatalogPg2026 }   # DEV-only; prod'da Secret
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }   # mount-kökü initdb tuzağı (lost+found)
          ports: [ { containerPort: 5432 } ]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - { name: init, configMap: { name: postgres-init } }
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ecommerce }
spec: { selector: { app: postgres }, ports: [ { port: 5432, targetPort: 5432 } ] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: rabbitmq-data, namespace: ecommerce }
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: ecommerce }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports: [ { containerPort: 5672 }, { containerPort: 15672 } ]
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: rabbitmq-data } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: ecommerce }
spec:
  selector: { app: rabbitmq }
  ports: [ { name: amqp, port: 5672, targetPort: 5672 }, { name: mgmt, port: 15672, targetPort: 15672 } ]
---
# Redis = HybridCache L2 (paylaşımlı önbellek). Bayat-toleranslı → PVC YOK (ephemeral kabul).
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [ { containerPort: 6379 } ]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: ecommerce }
spec: { selector: { app: redis }, ports: [ { port: 6379, targetPort: 6379 } ] }
