apiVersion: v1
kind: Service
metadata: { name: scout-agent, namespace: ecommerce }
spec: { selector: { app: scout-agent }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
# ───────────── gateway (YARP — React tek-origin + kenar yetki) ─────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: gateway
          image: ghcr.io/hasancagri/ecommerce/gateway:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "GatewayAuthOptions__AdminApiKey", valueFrom: { secretKeyRef: { name: gateway-admin, key: apikey } } }
            # YARP cluster destination'ları (http://<host>) service-discovery resolver ile çözülür.
            - { name: "services__catalog-api__http__0", value: "http://catalog-api:8080" }
            - { name: "services__file-api__http__0", value: "http://file-api:8080" }
            - { name: "services__personalization-api__http__0", value: "http://personalization-api:8080" }
            - { name: "services__scout-agent__http__0", value: "http://scout-agent:8080" }
            - { name: "services__reviews-api__http__0", value: "http://reviews-api:8080" }
          livenessProbe:  { httpGet: { path: /alive,  port: 8080 }, initialDelaySeconds: 20, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: ecommerce }
spec: { selector: { app: gateway }, ports: [ { port: 8080, targetPort: 8080 } ] }
