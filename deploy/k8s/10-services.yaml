# 14 ECommerce servisi — image :latest + imagePullPolicy Always (CD rollout yeni image çeker).
# Issuer TEK string, trailing-slash YOK: https://id.hasancagridemiriz.com (token iss = SetIssuer; servis
# IdentityOption__Issuer birebir eşleşmeli — slash tuzağı). Sırlar secretKeyRef (cluster'da bir kez; Task 5).
# Probe: liveness /alive, readiness /health. checkout kapsam DIŞI → payment PG-link env'leri yok.
# SÖKÜLDÜ: storefront-api, checkout-orchestrator, mail-mcp, notification-agent (+ES/kibana/mailpit).
---
# ───────────── identity-server (OpenIddict IdP — çözüm içinde) ─────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-server, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: identity-server } }
  template:
    metadata: { labels: { app: identity-server } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: identity-server
          image: ghcr.io/hasancagri/ecommerce/identity-server:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__identityDb", value: "Host=postgres;Port=5432;Username=postgres;Password=CatalogPg2026;Database=identityDb" }
            # issuer HTTPS zorunlu (Program.cs guard) — ingress TLS + ForwardedHeaders ile http backend yeter.
            - { name: "OpenIddict__Issuer", value: "https://id.hasancagridemiriz.com" }
            # react-web (Clients[0]) redirect'leri canlı web host'una — fresh DB seed'i bu override'ı alır.
            - { name: "AppRegistry__Apps__0__Clients__0__RedirectUris__0", value: "https://hasancagridemiriz.com/callback" }
            - { name: "AppRegistry__Apps__0__Clients__0__PostLogoutRedirectUris__0", value: "https://hasancagridemiriz.com/" }
            - { name: "BootstrapAdmin__Email", valueFrom: { secretKeyRef: { name: identity-admin, key: email } } }
            - { name: "BootstrapAdmin__Password", valueFrom: { secretKeyRef: { name: identity-admin, key: password } } }
            - { name: "Authentication__Google__ClientId", valueFrom: { secretKeyRef: { name: google, key: clientid } } }
            - { name: "Authentication__Google__ClientSecret", valueFrom: { secretKeyRef: { name: google, key: clientsecret } } }
          # identity-server ServiceDefaults /health+/alive KULLANMAZ (EF+Razor istisnası) → tcpSocket probe
          # (port dinliyor = ayakta; http health ucu yok, httpGet 404 → yanlış CrashLoop).
          livenessProbe:  { tcpSocket: { port: 8080 }, initialDelaySeconds: 20, periodSeconds: 15 }
          readinessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: identity-server, namespace: ecommerce }
spec: { selector: { app: identity-server }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
# ───────────── catalog-api ─────────────
