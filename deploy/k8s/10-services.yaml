# 094 pay-by-link: PG hosted ödeme sayfasından tarayıcı dönüşü (GET /checkout/done, Order.Api). Public host
# gerekir (ClusterIP yetmez). VARSAYIM: Traefik + cert-manager ClusterIssuer "letsencrypt-prod" kurulu;
# Cloudflare DNS app.hasancagridemiriz.com → cluster giriş IP'si. Yalnız /checkout/done expose edilir.
# NOT: EC servisleri ForwardedHeaders gerektirir (ingress TLS sonlandırır → backend http) — ServiceDefaults.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-api
  namespace: ecommerce
  annotations: { cert-manager.io/cluster-issuer: "letsencrypt-prod" }
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ "app.hasancagridemiriz.com" ]
      secretName: app-tls
  rules:
    - host: "app.hasancagridemiriz.com"
      http:
        paths:
          - path: /checkout/done
            pathType: Prefix
            backend: { service: { name: order-api, port: { number: 8080 } } }
