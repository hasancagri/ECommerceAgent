# 15 ECommerce servisi — image :latest + imagePullPolicy Always (CD rollout'ta yeni image çeker).
# Sırlar: OpenAI __ApiKey = secretKeyRef(openai). ghcr-pull + openai secret'ları cluster'da BİR KEZ kurulur
# (CD'de değil; bkz. deploy/k8s/README). DEV config (SagaAuth/Payment/R2/SMTP/IdentityOption) = placeholder;
# gerçek auth/ödeme/mail için prod değerleri gerekir.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-api, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata: { labels: { app: catalog-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: catalog-api
          image: ghcr.io/hasancagri/ecommerce/catalog-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__catalogDb", value: "Host=postgres;Port=5432;Username=postgres;Password=CatalogPg2026;Database=catalogDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "ImportOptions__PublicBaseUrl", value: "http://catalog-api:8080" }
            - { name: "IdentityOption__Address", value: "https://id.hasancagridemiriz.com" }
            - { name: "IdentityOption__Issuer", value: "https://id.hasancagridemiriz.com/" }
            - { name: "IdentityOption__Audience", value: "catalog.api" }
            # 091 açılış seed'i: books.json image'da (/app/Seeding/Data/books.json). Local Aspire'da yolu
            # AppHost enjekte eder; k8s'te YOK → SourceJsonPath boş → seeder atlar (boş katalog). Burada set.
            - { name: "SeedOptions__SourceJsonPath", value: "/app/Seeding/Data/books.json" }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-api, namespace: ecommerce }
spec: { selector: { app: catalog-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
