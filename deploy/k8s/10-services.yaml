apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-api, namespace: ecommerce }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata: { labels: { app: payment-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: payment-api
          image: ghcr.io/hasancagri/ecommerce/payment-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__paymentDb", value: "Host=postgres;Port=5432;Username=postgres;Password=CatalogPg2026;Database=paymentDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "IdentityOption__Address", value: "https://id.hasancagridemiriz.com" }
            - { name: "IdentityOption__Issuer", value: "https://id.hasancagridemiriz.com/" }
            - { name: "IdentityOption__Audience", value: "payment.api" }
            - { name: "SagaAuth__ClientId", value: "payment-s2s" }
            - { name: "SagaAuth__ClientSecret", value: "dummy-saga-secret" }
            # 094 pay-by-link: kod section'ı PgPaymentLinkOptions (nameof ile bind). Eski PaymentOptions__* YANLIŞ
            # prefix'ti (hiç bağlanmıyordu → BaseUrl appsettings localhost:5201'de kalıp GATEWAY_UNAVAILABLE).
            # BaseUrl = cross-ns PG (ns pg). StoreApiKey/CallbackSecret = pg-secrets ile BİREBİR eşit (ec-payment-secrets).
            # MerchantId = PG dev-seeder ile aynı (Live mağaza). ReturnUrl = EC ingress (app.hasancagridemiriz.com).
            - { name: "PgPaymentLinkOptions__BaseUrl", value: "http://payment-api.pg:8080" }
            - { name: "PgPaymentLinkOptions__MerchantId", value: "11111111-1111-1111-1111-111111111111" }
            - { name: "PgPaymentLinkOptions__StoreName", value: "Kitapçı" }
            - { name: "PgPaymentLinkOptions__ReturnUrl", value: "https://app.hasancagridemiriz.com/checkout/done" }
            - { name: "PgPaymentLinkOptions__StoreApiKey", valueFrom: { secretKeyRef: { name: ec-payment-secrets, key: store-api-key } } }
            - { name: "PgPaymentLinkOptions__CallbackSecret", valueFrom: { secretKeyRef: { name: ec-payment-secrets, key: store-callback-secret } } }
            - { name: "services__customer-api__http__0", value: "http://customer-api:8080" }
---
