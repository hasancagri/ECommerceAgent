# Dış erişim — Traefik ingress + cert-manager Let's Encrypt (sslip.io).
# İKİ host: app.<ip>.sslip.io (web + API aynı origin, path-split → CORS yok) · id.<ip>.sslip.io (identity).
# ÖN KOŞUL (bir kez, elle): cert-manager kurulu olmalı (k3s'te Traefik gömülü ama cert-manager DEĞİL).
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
# Yoksa ClusterIssuer CRD'si bulunmaz → bu dosyanın apply'ı hata verir.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: letsencrypt-prod }
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hasancagridemiriz@gmail.com
    privateKeySecretRef: { name: letsencrypt-prod-account }
    solvers:
      - http01:
          ingress: { class: traefik }
---
# app host: /api + /files → gateway (YARP); kalan her şey → web (nginx SPA).
# React VITE_API_BASE_URL boş → relative /api çağrıları aynı origin'de gateway'e düşer (CORS yok).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: ecommerce
  annotations: { cert-manager.io/cluster-issuer: "letsencrypt-prod" }
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ "hasancagridemiriz.com" ]
      secretName: app-tls
  rules:
    - host: "hasancagridemiriz.com"
      http:
        paths:
          - { path: /api,   pathType: Prefix, backend: { service: { name: gateway, port: { number: 8080 } } } }
          - { path: /files, pathType: Prefix, backend: { service: { name: gateway, port: { number: 8080 } } } }
          - { path: /,      pathType: Prefix, backend: { service: { name: web,     port: { number: 80 } } } }
---
# SPA (web origin) → id.host discovery/token/jwks XHR'ları cross-origin → CORS şart. Identity'nin
# SpaCors'u (compile-time) yeni image gelene dek domain'i içermeyebilir → Traefik CORS middleware ile
# ACAO enjekte edilir (image'dan bağımsız, kalıcı).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: id-cors, namespace: ecommerce }
spec:
  headers:
    accessControlAllowOriginList: [ "https://hasancagridemiriz.com" ]
    accessControlAllowMethods: [ "GET", "POST", "OPTIONS" ]
    accessControlAllowHeaders: [ "*" ]
    accessControlMaxAge: 100
    addVaryHeader: true
---
# id host: tüm yollar identity-server (OpenIddict + Razor /Account, /connect, /.well-known, /signin-google).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity
  namespace: ecommerce
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: ecommerce-id-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ "id.hasancagridemiriz.com" ]
      secretName: id-tls
  rules:
    - host: "id.hasancagridemiriz.com"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: identity-server, port: { number: 8080 } } } }
